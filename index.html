<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Discount Recommender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8f9fa;
    }

    h1, h2 {
      color: #333;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      font-size: 14px;
    }

    button:hover {
      background-color: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f1f1f1;
    }

    #results p {
      background: white;
      padding: 16px;
      border-radius: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
    }

    input:focus {
      outline: none;
      border: 1px solid #007bff;
      box-shadow: 0 0 4px rgba(0,123,255,0.4);
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Flight Discount Recommender</h1>

  <form id="search-form">
    <div class="form-grid">

      <div class="form-group">
        <label for="origin">Origin</label>
        <input type="text" id="origin" name="origin" placeholder="e.g. SIN" required />
      </div>

      <div class="form-group">
        <label for="destination">Destination</label>
        <input type="text" id="destination" name="destination" placeholder="e.g. NRT" required />
      </div>

      <div class="form-group">
        <label for="date">Departure Date</label>
        <input type="date" id="date" name="date" required />
      </div>

      <div class="form-group">
        <label for="number_of_passengers">Passengers</label>
        <input type="number" id="number_of_passengers" name="number_of_passengers" min="1" value="1" required />
      </div>

    </div>

    <button type="submit" id="search-btn">🔍 Search Best Deals</button>
  </form>

  <h2>Results</h2>
  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
